# Lint, typecheck, test, and red-team eval for agent-guard.
#
# Assumptions:
# - Python 3.10–3.12 match pyproject classifiers / README.
# - ruff and pytest are pinned below (and in [project.optional-dependencies] dev)
#   so CI does not float on latest minor releases.
# - mypy runs strict on src/ only (configured in pyproject.toml).
# - Default pytest includes coverage fail-under 90 from pyproject.toml.
# - Red-team eval (`pytest --agent-guard-redteam`) is deterministic: GullibleAgent
#   + bundled scenarios, no API key. Cheap enough to run on every PR/push.
# - Optional extras (langgraph, mcp) are not required for the default suite;
#   integration tests that need them skip or use thin in-tree stubs as coded.
# - This workflow does not deploy and does not use repository secrets.
# - publish.yml remains tag-only for PyPI trusted publishing.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install "ruff==0.14.14" "pytest==8.3.5"

      - name: Ruff
        run: ruff check . && ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest

  redteam:
    name: red-team eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install "ruff==0.14.14" "pytest==8.3.5"

      - name: Red-team scenarios
        run: pytest --agent-guard-redteam -q
