# Local hooks matching CI linters, plus a secret scanner.
# Enable: pip install pre-commit && pre-commit install
# See CONTRIBUTING.md.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
