[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-guard"
version = "0.1.0"
description = "Governed tool execution for AI agents: policy, human approval, and an audit hash chain."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miles Waite" }]
keywords = ["ai", "agents", "policy", "approval", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "PyYAML>=6.0.4",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
mcp = ["mcp>=1.0"]
dev = [
    "mypy>=1.13",
    "pytest==8.3.5",
    "pytest-cov>=5",
    "ruff==0.14.14",
    "types-PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/WaiteM124/agent-guard"
Repository = "https://github.com/WaiteM124/agent-guard"
Changelog = "https://github.com/WaiteM124/agent-guard/blob/main/CHANGELOG.md"

[project.scripts]
agent-guard = "agent_guard.cli:main"

[project.entry-points.pytest11]
agent_guard = "agent_guard.redteam.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_guard = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--cov=agent_guard --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["agent_guard"]
branch = false

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/test_policy.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agent_guard"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
